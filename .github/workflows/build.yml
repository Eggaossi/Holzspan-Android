name: APK bauen

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android-SDK ist auf ubuntu-latest schon vorinstalliert
      # (android-actions/setup-android@v3 scheiterte am Paket 'tools').

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: APK bauen
        run: gradle assembleRelease --no-daemon

      - name: APK bereitlegen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/app.apk
          echo "Version 1.0.${{ github.run_number }} (Build ${{ github.run_number }})" > out/version.txt

      # Regel KI_Allgemein: Artefakt-Schritt nie blockierend, 1 Tag Aufbewahrung
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Holzspan-${{ github.run_number }}
          path: out/app.apk
          retention-days: 1

      - name: In Zweig apk legen (fuer die Projekt-Zentrale)
        run: |
          cd out
          git init -q -b apk
          git add app.apk version.txt
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Build ${{ github.run_number }} von ${{ github.sha }}"
          git push -q --force https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git apk
