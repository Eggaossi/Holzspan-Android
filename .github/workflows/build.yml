name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Holzspan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Holzspan-APK
          path: Holzspan.apk

      - name: Als Release "neueste" veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neueste
          name: Holzspan neueste Version
          body: "Automatisch gebaut aus ${{ github.sha }}"
          files: Holzspan.apk
          make_latest: true
